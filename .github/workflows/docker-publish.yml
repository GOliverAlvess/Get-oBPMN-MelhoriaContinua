name: Build and Push to Docker Hub

on:
  push:
    branches:
      - dev # Triga a pipeline para envios na branch dev, permitindo abertura de PRs para a main/master

jobs:
  test-and-lint:
    name: Run Automated Tests & Linters
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura o Node.js para rodar os testes e lint
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instala as dependências do projeto de forma limpa e rápida
      - name: Install Dependencies
        run: npm ci

      # 4. Executa a validação de tipos e lint do TypeScript
      - name: Run Linter
        run: npm run lint

      # 5. Executa todos os testes automatizados com o Vitest
      - name: Run Automated Tests
        run: npm run test

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint # Garante que os testes passem com sucesso ANTES de gerar a imagem Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura o QEMU para suporte a múltiplas arquiteturas (opcional, mas recomendado)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Configura o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Faz login no Docker Hub usando os Secrets do GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Define variáveis para taggear a imagem de forma amigável (ex: latest e com o short sha do commit)
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 6. Compila e envia a imagem para o Docker Hub com tags de SHA e Numeração de Série auto-incrementada
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pdca-system-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pdca-system-app:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pdca-system-app:v${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pdca-system-app:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
