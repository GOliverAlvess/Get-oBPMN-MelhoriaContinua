version: '3.8'

services:
  # Aplicação Node.js Express + React
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdca-system-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=${MONGODB_URI}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY}
      - GOOGLE_DRIVE_PARENT_FOLDER_ID=${GOOGLE_DRIVE_PARENT_FOLDER_ID:-0AFf6OFctpR_7Uk9PVA}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

