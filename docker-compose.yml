version: '3.8'

services:
  # Base de dados NoSQL Local (MongoDB)
  mongodb:
    image: mongo:6.0
    container_name: pdca-system-db
    restart: unless-stopped
    volumes:
      - ./mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017" # Apenas acessível localmente no host por segurança

  # Aplicação Node.js Express + React
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdca-system-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/pdca_system
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY}
      - GOOGLE_DRIVE_PARENT_FOLDER_ID=${GOOGLE_DRIVE_PARENT_FOLDER_ID:-1fvFyLFU1QGZkfOxYvreHxtEZVWE8l_96}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

